name: dtn_messenger
description: "DTN Messenger — Delay-Tolerant Network messaging application for Android and Windows."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Local database
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.4+4

  # Unique IDs
  uuid: ^4.5.1

  # File picking
  file_picker: ^8.1.7

  # Image handling
  cached_network_image: ^3.4.1

  # Audio playback
  just_audio: ^0.10.2

  # Video playback
  video_player: ^2.9.2

  # Path utilities
  path_provider: ^2.1.5
  path: ^1.9.1

  # Shared preferences for settings
  shared_preferences: ^2.3.4

  # HTTP for local network communication
  http: ^1.2.2

  # JSON serialization
  json_annotation: ^4.9.0

  # Crypto / checksums
  crypto: ^3.0.6

  # Mime type detection
  mime: ^2.0.0

  # Intl for date formatting
  intl: ^0.19.0

  # Network info (Wi-Fi SSID etc.)
  network_info_plus: ^6.1.1

  # Connectivity
  connectivity_plus: ^6.1.4

  # Permission handler
  permission_handler: ^11.3.1

  # Image viewer
  photo_view: ^0.15.0

  # Adaptive layout
  adaptive_breakpoints: ^0.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.9.4
  mockito: ^5.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
