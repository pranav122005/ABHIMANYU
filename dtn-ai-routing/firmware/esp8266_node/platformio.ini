; PlatformIO Project Configuration File for ESP8266 NodeMCU v2
; ABHIMANYU DTN — Autonomous Node Firmware (ESP-NOW + OLED + AI Decision Tree)

[platformio]
default_envs = node_a, node_b
src_dir = src
include_dir = include

; -----------------------------------------------------------------------------
; Common Base Configuration
; -----------------------------------------------------------------------------
[env]
platform = espressif8266
board = nodemcuv2
framework = arduino

; Target: Tensilica Xtensa L106 @ 80 MHz, 80 KB RAM, 4 MB Flash
board_build.f_cpu = 80000000L
board_build.flash_mode = dio

build_unflags = -std=gnu++11
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Os
    -Iinclude
    -I../../models/stage5

monitor_speed = 115200
upload_speed = 115200

; -----------------------------------------------------------------------------
; Node A: Transmitter / Gateway with I2C OLED Display (D1=SCL, D2=SDA)
; -----------------------------------------------------------------------------
[env:node_a]
build_flags =
    ${env.build_flags}
    -D DTN_NODE_A
    -D DTN_NODE_ID=\"node_a\"
    -D DTN_PEER_NODE_ID=\"node_b\"
    -D DTN_HAS_OLED=1
    -D DTN_WIFI_CHANNEL=1

; -----------------------------------------------------------------------------
; Node B: Autonomous Peer without Display (Headless)
; -----------------------------------------------------------------------------
[env:node_b]
build_flags =
    ${env.build_flags}
    -D DTN_NODE_B
    -D DTN_NODE_ID=\"node_b\"
    -D DTN_PEER_NODE_ID=\"node_a\"
    -D DTN_HAS_OLED=0
    -D DTN_WIFI_CHANNEL=1

; -----------------------------------------------------------------------------
; Generic Environment
; -----------------------------------------------------------------------------
[env:nodemcuv2]
build_flags =
    ${env.build_flags}
    -D DTN_NODE_ID=\"node_a\"
    -D DTN_PEER_NODE_ID=\"node_b\"
    -D DTN_HAS_OLED=1
    -D DTN_WIFI_CHANNEL=1
