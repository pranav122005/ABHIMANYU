; PlatformIO Project Configuration File for ESP8266 NodeMCU v2
; DTN AI Routing — Autonomous Node Firmware Foundation (Stage 6A)

[platformio]
default_envs = nodemcuv2
src_dir = src
include_dir = include

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

; Target: Tensilica Xtensa L106 @ 80 MHz, 80 KB RAM, 4 MB Flash
board_build.f_cpu = 80000000L
board_build.flash_mode = dio

; Build options: Modern C++17, all warnings enabled, small code size
build_unflags = -std=gnu++11
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Os
    -Iinclude
    -I../../models/stage5

; Serial Monitor Options
monitor_speed = 115200
upload_speed = 115200

